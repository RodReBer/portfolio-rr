# Un solo paquete: la raíz es el único miembro.
packages:
  - '.'

# pnpm 11 corta el install si hay dependencias con scripts de instalación sin
# aprobar (ERR_PNPM_IGNORED_BUILDS). Estas dos los necesitan: esbuild (Astro y
# Vite) y sharp (las imágenes de Astro).
allowBuilds:
  esbuild: true
  sharp: true

# `@emnapi/core` y `@emnapi/runtime` están en devDependencies sin que el código
# los use: las dos mitades de emnapi tienen que ser de la misma versión, y como
# algunos paquetes de Astro aceptan la 2 beta, pnpm les daba el núcleo 1.x con la
# runtime 2 beta y `astro check` se cortaba con "this.bridge.setLastError is not
# a function". Al estar en la raíz, pnpm usa éstas. Se sacan cuando salga la 2.
